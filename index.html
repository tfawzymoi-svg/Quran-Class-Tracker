:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#18342f;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1120px;margin:0 auto;padding:22px 17px 80px}.top{background:#11695e;color:#fff;padding:18px 0;box-shadow:0 3px 12px #0c42371c}.top .inner{max-width:1120px;margin:auto;padding:0 17px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:21px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}.brand i{font-style:normal;font-size:27px}.tag{opacity:.86;font-size:12px;margin-top:4px}.top button{border:1px solid #ffffff70;border-radius:11px;padding:9px 12px;background:#ffffff15;color:#fff}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 24px}.hero h1{font-size:27px;margin:0 0 4px}.muted{color:#677c75;font-size:13px}.btn{border:0;background:#11695e;color:#fff;padding:11px 16px;border-radius:12px;font-weight:650}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#e6efec;color:#14594e}.btn.danger{background:#fff0ed;color:#a33b2c}.btn.small{padding:7px 11px;font-size:13px}.btn.outline{background:#fff;border:1px solid #bad0c8;color:#176256}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid #e0eae5;border-radius:17px;padding:18px;box-shadow:0 2px 8px #15372c07}.stat span{display:block;font-size:12px;color:#6f837b}.stat strong{display:block;font-size:26px;margin-top:9px;color:#175a4f;line-height:1.2}.section{margin-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section h2{font-size:19px;margin:0}.toolbar{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}input,select,textarea{border:1px solid #cfdcd5;background:#fff;padding:11px -template-columns:repeat(7,1fr);gap:9px;align-items:end;height:145px}.daybar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:#71867d;gap:5px}.daybar .column{width:100%;max-width:37px;min-height:4px;background:#5bb49c;border-radius:6px 6px 2px 2px}.daybar b{font-weight:500}.notebox{font-size:13px;color:#657c70;line-height:1.55}.modal-layer{position:fixed;inset:0;background:#0b2c2499;display:flex;justify-content:center;align-items:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:19px;width:min(100%,570px);max-height:94vh;overflow:auto;padding:22px}.modal h2{margin:0 0 6px;font-size:21px}.modal p{margin:0 0 17px;font-size:13px;color:#647b70}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#425d54}.field input,.field select,.field textarea{width:100%}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}.hint{font-size:12px;color:#75897f;margin:6px 0 0}.notice{background:#eef7f2;border-radius:12px;padding:13px;color:#3e6a55;font-size:13px;line-height:1.5}.session-actions{margin-top:6px}.hide{display:none!important}.goals{font-size:13px;color:#5e7d70}.kpi-sub{font-size:11px;color:#93a49b;margin-top:4px}.foot{font-size:12px;color:#7b8d84;margin-top:24px;text-align:center}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b4036;color:#fff;padding:12px 18px;border-radius:11px;z-index:30;box-shadow:0 4px 18px #0002;max-width:90%;text-align:center}.surah-progress{font-size:12px;color:#657c72;margin-top:6px}.error{color:#b23832;font-size:12px;margin-top:6px}.hidden{display:none}#fileImport{display:none}@media(max-width:850px){.students{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:550px){.students{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}.hero{align-items:flex-start}.hero h1{font-size:24px}.top .brand{font-size:17px}.tag{font-size:11px}.wrap{padding:18px 13px 65px}.form-row{grid-template-columns:1fr}.stat strong{font-size:23px}}

<header class="top"><div class="inner"><div><div class="brand"><i>☪</i> Quran Class Tracker</div><div class="tag">New • Past • Homework • Student progress</div></div><button id="backupButton" title="Export and import class data">⚙ Data & Backup</button></div></header>
<main id="app" class="wrap"></main><div id="modalRoot"></div><input id="fileImport" type="file" accept=".json,application/json"><script>
'use strict';
const SURAHS=[['Al-Fatihah',7],['Al-Baqarah',286],['Ali Imran',200],['An-Nisa',176],['Al-Maidah',120],['Al-Anam',165],['Al-Araf',206],['Al-Anfal',75],['At-Tawbah',129],['Yunus',109],['Hud',123],['Yusuf',111],['Ar-Rad',43],['Ibrahim',52],['Al-Hijr',99],['An-Nahl',128],['Al-Isra',111],['Al-Kahf',110],['Maryam',98],['Ta-Ha',135],['Al-Anbiya',112],['Al-Hajj',78],['Al-Muminun',118],['An-Nur',64],['Al-Furqan',77],['Ash-Shuara',227],['An-Naml',93],['Al-Qasas',88],['Al-Ankabut',69],['Ar-Rum',60],['Luqman',34],['As-Sajdah',30],['Al-Ahzab',73],['Saba',54],['Fatir',45],['Ya-Sin',83],['As-Saffat',182],['Sad',88],['Az-Zumar',75],['Ghafir',85],['Fussilat',54],['Ash-Shura',53],['Az-Zukhruf',89],['Ad-Dukhan',59],['Al-Jathiyah',37],['Al-Ahqaf',35],['Muhammad',38],['Al-Fath',29],['Al-Hujurat',18],['Qaf',45],['Adh-Dhariyat',60],['At-Tur',49],['An-Najm',62],['Al-Qamar',55],['Ar-Rahman',78],['Al-Waqiah',96],['Al-Hadid',29],['Al-Mujadilah',22],['Al-Hashr',24],['Al-Mumtahanah',13],['As-Saff',14],['Al-Jumuah',11],['Al-Munafiqun',11],['At-Taghabun',18],['At-Talaq',12],['At-Tahrim',12],['Al-Mulk',30],['Al-Qalam',52],['Al-Haqqah',52],['Al-Maarij',44],['Nuh',28],['Al-Jinn',28],['Al-Muzzammil',20],['Al-Muddaththir',56],['Al-Qiyamah',40],['Al-Insan',31],['Al-Mursalat',50],['An-Naba',40],['An-Naziat',46],['Abasa',42],['At-Takwir',29],['Al-Infitar',19],['Al-Mutaffifin',36],['Al-Inshiqaq',25],['Al-Buruj',22],['At-Tariq',17],['Al-Ala',19],['Al-Ghashiyah',26],['Al-Fajr',30],['Al-Balad',20],['Ash-Shams',15],['Al-Layl',21],['Ad-Duha',11],['Ash-Sharh',8],['At-Tin',8],['Al-Alaq',19],['Al-Qadr',5],['Al-Bayyinah',8],['Az-Zalzalah',8],['Al-Adiyat',11],['Al-Qariah',11],['At-Takathur',8],['Al-Asr',3],['Al-Humazah',9],['Al-Fil',5],['Quraysh',4],['Al-Maun',7],['Al-Kawthar',3],['Al-Kafirun',6],['An-Nasr',3],['Al-Masad',5],['Al-Ikhlas',4],['Al-Falaq',5],['An-Nas',6]];
const KEY='quran-class-tracker-v1';let db=load();let selected=null;let search='';let groupFilter='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=> (crypto?.randomUUID?.() || Date.now()+'-'+Math.random());const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const nfmt=n=>new Intl.NumberFormat('en-US').format(n);function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.students)&&Array.isArray(x.sessions))return x}catch(e){}return {version:1,students:[],sessions:[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Storage is full or blocked. Please export a backup.');return false}}function sSessions(id){return db.sessions.filter(x=>x.studentId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.created-b.created)}function uniqueVerses(sessions){const bySurah=new Map;for(const s of sessions.filter(x=>x.type==='memorization')){let set=bySurah.get(s.surah)||new Set;for(let a=s.from;a<=s.to;a++)set.add(a);bySurah.set(s.surah,set)}let count=0;for(const set of bySurah.values())count+=set.size;return {count,bySurah}}const verseCount=s=>s.to-s.from+1;const learn=s=>sSessions(s.id).filter(x=>x.type==='memorization');const review=s=>sSessions(s.id).filter(x=>x.type==='revision');const homework=s=>sSessions(s.id).filter(x=>x.type==='homework');const attend=s=>sSessions(s.id).filter(x=>x.type==='attendance');function attendedSessionCount(ss){return new Set(ss.filter(x=>x.type!=='attendance'||x.status==='present').map(x=>x.date)).size}function formatDate(date){return new Date(date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}function blank(){return `<div class="empty">No students yet. Add your first student to start tracking.</div>`}function stat(label,num,sub=''){return `<div class="card stat"><span>${label}</span><strong>${nfmt(num)}</strong>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`}function toolbar(){let groups=[...new Set(db.students.map(s=>s.group).filter(Boolean))].sort();return `<div class="toolbar"><input id="searchBox" type="search" placeholder="Search students..." value="${esc(search)}" aria-label="Search students"><select id="groupFilter" aria-label="Filter by group"><option value="">All groups</option>${groups.map(g=>`<option value="${esc(g)}" ${g===groupFilter?'selected':''}>${esc(g)}</option>`).join('')}</select></div>`}
function renderHome(){const now=today();let classes=new Set(db.students.map(x=>x.group).filter(Boolean));let todaySessions=db.sessions.filter(x=>x.date===now);const pending=db.sessions.filter(x=>x.type==='homework'&&x.status!=='completed').sort((a,b)=>(a.dueDate||a.date).localeCompare(b.dueDate||b.date));const studentName=id=>db.students.find(s=>s.id===id)?.name||'Unknown student';$('app').innerHTML=`<div class="hero"><div><h1>Class Overview</h1><div class="muted">Today: ${esc(formatDate(now))} · See how your students are progressing</div></div><button class="btn" id="addStudent">+ Add Student</button></div><div class="grid">${stat('Students',db.students.length)}${stat('Groups',classes.size)}${stat('Students today',new Set(todaySessions.map(x=>x.studentId)).size)}${stat('Sessions today',todaySessions.length)}</div><div class="section"><div class="section-head"><h2>Homework</h2><button class="btn small" id="homeAssign">+ Assign Homework</button></div><div class="card"><div class="section-head"><span class="muted">Pending assignments for all students</span><span class="pill">${pending.length} pending</span></div>${pending.length?pending.map(x=>`<div class="entry"><div class="entry-head"><strong>${esc(studentName(x.studentId))}</strong><span class="pill ${x.dueDate<now?'absent':'attendance'}">${x.dueDate<now?'Overdue':'Pending'}</span></div><div class="desc">${esc(SURAHS[x.surah]?.[0]||'Surah')} · Ayahs ${x.from}–${x.to} · Due: ${esc(formatDate(x.dueDate||x.date))}${x.notes?' · '+esc(x.notes):''}</div><div class="actions session-actions"><button class="btn secondary small" data-home-open="${esc(x.studentId)}">Student Profile</button><button class="btn outline small" data-home-done="${esc(x.id)}">Mark Completed</button></div></div>`).join(''):'<p class="notebox">No pending homework. Assign a new task to a student.</p>'}</div></div><div class="section"><div class="section-head"><h2>Students</h2><span class="muted">${db.students.length} enrolled</span></div>${toolbar()}<div id="studentList"></div></div><p class="foot">Your records stay on this device. Export backups regularly; clearing browser data may remove records.</p>`;$('addStudent').onclick=()=>openStudent();$('homeAssign').onclick=()=>{if(!db.students.length){alert('Add a student first.');return}modal(`<h2>Assign Homework</h2><p>Select a student to create an assignment.</p><div class="field"><label for="homeStudent">Student Name</label><select id="homeStudent">${[...db.students].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}${s.group?' · '+esc(s.group):''}</option>`).join('')}</select></div><div class="modal-footer"><button type="button" class="btn secondary" data-close>Cancel</button><button type="button" class="btn" id="homeContinue">Continue</button></div>`);$('homeContinue').onclick=()=>{selected=$('homeStudent').value;closeModal();openSession('homework')}};document.querySelectorAll('[data-home-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.homeOpen;render()});document.querySelectorAll('[data-home-done]').forEach(b=>b.onclick=()=>{const item=db.sessions.find(x=>x.id===b.dataset.homeDone);if(item&&item.type==='homework'){item.status='completed';item.completedAt=today();save();render()}});$('searchBox').oninput=e=>{search=e.target.value;renderStudents()};$('groupFilter').onchange=e=>{groupFilter=e.target.value;renderStudents()};renderStudents()}
function renderStudents(){let list=db.students.filter(s=>s.name.toLowerCase().includes(search.toLowerCase())&&(!groupFilter||s.group===groupFilter)).sort((a,b)=>a.name.localeCompare(b.name));$('studentList').innerHTML=list.length?`<div class="students">${list.map(s=>{let ss=sSessions(s.id),count=uniqueVerses(ss).count,latest=ss.length?formatDate(ss[0].date):'No records';return `<button class="student" data-id="${esc(s.id)}"><div class="student-top"><div class="avatar">${esc(s.name.trim().slice(0,1).toUpperCase())}</div><div><strong>${esc(s.name)}</strong><div class="sub">${esc(s.group||'No group')} · ${ss.length} records</div></div></div><div class="mini"><span>New: <b>${nfmt(count)} verses</b></span><span>Last: <b>${esc(latest)}</b></span></div></button>`}).join('')}</div>`:`<div class="empty">No students match your search.</div>`;document.querySelectorAll('.student').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()})}
function renderDetail(){let s=db.students.find(x=>x.id===selected);if(!s){selected=null;renderHome();return}let ss=sSessions(s.id),mem=learn(s),rev=review(s),unique=uniqueVerses(ss),reviewed=rev.reduce((n,x)=>n+verseCount(x),0),last=ss.length?formatDate(ss[0].date):'No activity yet';let grouped=[...unique.bySurah.entries()].sort((a,b)=>a[0]-b[0]);let latestNote=ss.find(x=>x.notes?.trim());let recentAssessment=ss.find(x=>x.type!=='attendance'&&x.rating&&x.rating!=='Not rated');let attend=ss.filter(x=>x.type==='attendance');let hw=homework(s),pending=hw.filter(x=>x.status!=='completed');$('app').innerHTML=`<button class="btn secondary small back" id="back">← All Students</button><div class="detail-head"><div><h1>${esc(s.name)}</h1><div class="meta">Today: ${esc(formatDate(today()))} · ${esc(s.group||'No group')} ${s.joined?' · Enrolled '+formatDate(s.joined):''}</div></div><div class="actions"><button class="btn outline" id="editStudent">Edit Student</button><button class="btn" id="addSession">+ Record Session</button></div></div><div class="section"><div class="grid">${stat('Unique verses — New',unique.count,'Repeated ranges counted once')}${stat('Verses — Past',reviewed,'Repeated practice included')}${stat('New Sessions',mem.length)}${stat('Past Sessions',rev.length)}</div></div><div class="section"><div class="two"><div class="card"><h3>Latest Assessment</h3><p class="notebox">${recentAssessment?`<strong>${esc(recentAssessment.rating)}</strong> · ${esc(formatDate(recentAssessment.date))}`:'No assessment recorded yet.'}</p><p class="hint">Latest session: ${esc(last)}</p></div><div class="card"><h3>Teacher Notes</h3><p class="notebox">${latestNote?esc(latestNote.notes):'No teacher notes yet.'}</p><p class="hint">${attend.filter(x=>x.status==='absent').length} recorded absences</p></div></div></div><div class="section"><div class="card"><div class="section-head"><h3 style="margin:0">Homework</h3><button class="btn secondary small" id="addHomework">+ Assign Homework</button></div><p class="notebox">${pending.length} pending assignment${pending.length===1?'':'s'}</p>${hw.length?hw.slice(0,15).map(x=>`<div class="entry"><div class="entry-head"><strong>${esc(SURAHS[x.surah]?.[0]||'Surah')} · Ayahs ${x.from}–${x.to}</strong><span class="pill ${x.status==='completed'?'':'attendance'}">${x.status==='completed'?'Completed':'Pending'}</span></div><div class="desc">Assigned: ${esc(formatDate(x.date))} · Due: ${esc(formatDate(x.dueDate||x.date))}${x.notes?' · '+esc(x.notes):''}</div><div class="session-actions actions">${x.status!=='completed'?`<button class="btn secondary small" data-complete="${esc(x.id)}">Mark Completed</button>`:''}<button class="btn danger small" data-delete="${esc(x.id)}">Delete</button></div></div>`).join(''):'<p class="notebox">No homework assigned yet.</p>'}</div></div><div class="section"><div class="card"><h3>New by Surah</h3>${grouped.length?grouped.map(([id,set])=>`<div class="entry"><div class="entry-head"><strong>${id+1}. ${esc(SURAHS[id][0])}</strong><span class="muted">${set.size} / ${SURAHS[id][1]} verses</span></div><div class="bar"><div class="fill" style="width:${set.size/SURAHS[id][1]*100}%"></div></div></div>`).join(''):'<p class="notebox">No New records yet.</p>'}</div></div><div class="section"><div class="section-head"><h2>Session History</h2><button class="btn secondary small" id="recordMore">+ Record</button></div><div class="card" id="history">${ss.length?ss.slice(0,100).map(x=>{let type=x.type==='memorization'?'New':x.type==='revision'?'Past':x.type==='homework'?'Homework':'Attendance';return `<div class="entry"><div class="entry-head"><strong>${esc(formatDate(x.date))} · ${esc(type)}</strong><span class="pill ${x.type==='revision'?'review':x.type==='homework'?'attendance':x.type==='attendance'?(x.status==='absent'?'absent':'attendance'):''}">${x.type==='attendance'||x.type==='homework'?esc(x.status):esc(x.rating||'Not rated')}</span></div><div class="desc">${x.type==='attendance'?'Attendance recorded':`${esc(SURAHS[x.surah]?.[0]||'Surah')} · Ayahs ${x.from}–${x.to} · ${verseCount(x)} verses${x.type==='homework'?' · Due: '+esc(formatDate(x.dueDate||x.date)):''}`}${x.notes?'<div>Note: '+esc(x.notes)+'</div>':''}</div><div class="session-actions"><button class="btn danger small" data-delete="${esc(x.id)}">Delete</button></div></div>`}).join(''):'<p class="notebox">No sessions recorded. Add a session to start tracking progress.</p>'}</div></div><p class="foot">Recorded ranges are not a formal assessment of mastery.</p>`;$('back').onclick=()=>{selected=null;render()};$('addSession').onclick=$('recordMore').onclick=()=>openSession();$('editStudent').onclick=()=>openStudent(s);$('addHomework').onclick=()=>openSession('homework');document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{let item=db.sessions.find(x=>x.id===b.dataset.complete);if(item){item.status='completed';item.completedAt=today();save();render()}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this session record? This cannot be undone.')){db.sessions=db.sessions.filter(x=>x.id!==b.dataset.delete);save();render()}})}
function render(){if(selected)renderDetail();else renderHome()}
function modal(content){$('modalRoot').innerHTML=`<div class="modal-layer"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);$('modalRoot').querySelector('.modal-layer').addEventListener('click',e=>{if(e.target.classList.contains('modal-layer'))closeModal()})}function closeModal(){$('modalRoot').innerHTML=''}
function openStudent(s){modal(`<h2>${s?'Edit Student':'Add Student'}</h2><p>Enter the student name and group.</p><form id="studentForm"><div class="field"><label for="sname">Student name *</label><input id="sname" maxlength="80" required value="${esc(s?.name||'')}" placeholder="Full name"></div><div class="form-row"><div class="field"><label for="sgroup">Class / group</label><input id="sgroup" maxlength="60" value="${esc(s?.group||'')}" placeholder="e.g. Group A"></div></div><div class="field"><label for="sjoined">Enrollment date</label><input id="sjoined" type="date" value="${esc(s?.joined||today())}"></div><div class="modal-footer">${s?'<button type="button" class="btn danger" id="deleteStudent">Delete Student</button>':''}<button type="button" class="btn secondary" data-close>Cancel</button><button class="btn" type="submit">${s?'Save Changes':'Add Student'}</button></div></form>`);$('studentForm').onsubmit=e=>{e.preventDefault();let name=$('sname').value.trim(),group=$('sgroup').value.trim(),joined=$('sjoined').value;if(!name)return;if(s){Object.assign(s,{name,group,joined})}else db.students.push({id:uid(),name,group,joined});save();closeModal();render()};if(s)$('deleteStudent').onclick=()=>{if(confirm('Permanently delete this student and ALL their records? Export a backup first.')){db.students=db.students.filter(x=>x.id!==s.id);db.sessions=db.sessions.filter(x=>x.studentId!==s.id);selected=null;save();closeModal();render()}}}
function openSession(defaultType){let s=db.students.find(x=>x.id===selected);if(!s)return;const opts=SURAHS.map(([name,num],i)=>`<option value="${i}">${i+1}. ${esc(name)} (${num})</option>`).join('');modal(`<h2>Record a Session</h2><p><strong>Student: ${esc(s.name)}</strong> · Today: ${esc(formatDate(today()))}</p><form id="sessionForm"><div class="form-row"><div class="field"><label for="rdate">Date *</label><input id="rdate" type="date" value="${today()}" required></div><div class="field"><label for="rtype">Record type</label><select id="rtype"><option value="memorization" ${defaultType==='memorization'?'selected':''}>New</option><option value="revision">Past</option><option value="homework" ${defaultType==='homework'?'selected':''}>Homework</option><option value="attendance">Attendance only</option></select></div></div><div id="versesFields"><div class="field"><label for="rsurah">Surah</label><select id="rsurah">${opts}</select></div><div class="form-row"><div class="field"><label for="rfrom">From ayah</label><input id="rfrom" type="number" min="1" value="1" required></div><div class="field"><label for="rto">To ayah</label><input id="rto" type="number" min="1" value="7" required></div></div><p class="hint" id="rangeHint">Al-Fatihah has 7 ayahs.</p><div id="homeworkFields" class="hidden"><div class="field"><label for="rdue">Homework due date *</label><input type="date" id="rdue" value="${today()}"></div><div class="field"><label for="rhstatus">Homework status</label><select id="rhstatus"><option value="pending">Pending</option><option value="completed">Completed</option></select></div></div><div class="field" id="assessmentField"><label for="rrating">Assessment</label><select id="rrating"><option value="Excellent">Excellent</option><option value="Good" selected>Good</option><option value="Needs practice">Needs practice</option><option value="Not rated">Not rated</option></select></div></div><div id="attendanceFields" class="hidden"><div class="field"><label for="rstatus">Attendance</label><select id="rstatus"><option value="present">Present</option><option value="absent">Absent</option></select></div></div><div class="field"><label for="rnotes">Teacher notes (optional)</label><textarea id="rnotes" maxlength="500" rows="3" placeholder="Areas to improve, tajweed, fluency, next steps..."></textarea></div><div id="formError" class="error" aria-live="polite"></div><div class="modal-footer"><button type="button" class="btn secondary" data-close>Cancel</button><button type="submit" class="btn">Save Session</button></div></form>`);function update(){let index=Number($('rsurah').value),max=SURAHS[index][1];$('rfrom').max=$('rto').max=max;$('rangeHint').textContent=`${SURAHS[index][0]} has ${max} ayahs.`;if(Number($('rto').value)>max)$('rto').value=max;let at=$('rtype').value==='attendance';$('versesFields').classList.toggle('hidden',at);$('attendanceFields').classList.toggle('hidden',!at);let hw=$('rtype').value==='homework';$('homeworkFields').classList.toggle('hidden',!hw);$('assessmentField').classList.toggle('hidden',hw);$('rdue').required=hw;$('rfrom').required=$('rto').required=!at}$('rtype').onchange=update;$('rsurah').onchange=update;update();$('sessionForm').onsubmit=e=>{e.preventDefault();let type=$('rtype').value,date=$('rdate').value,notes=$('rnotes').value.trim(),obj={id:uid(),studentId:s.id,type,date,notes,created:Date.now()};if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ $('formError').textContent='Choose a valid date.';return}if(type==='attendance')obj.status=$('rstatus').value;else{obj.surah=Number($('rsurah').value);obj.from=Number($('rfrom').value);obj.to=Number($('rto').value);if(type==='homework'){obj.dueDate=$('rdue').value;obj.status=$('rhstatus').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(obj.dueDate)||obj.dueDate<date){$('formError').textContent='Choose a homework due date on or after the assignment date.';return}}else obj.rating=$('rrating').value;let max=SURAHS[obj.surah][1];if(!Number.isInteger(obj.from)||!Number.isInteger(obj.to)||obj.from<1||obj.from>obj.to||obj.to>max){$('formError').textContent=`Choose ayahs between 1 and ${max}, with the starting ayah no greater than the ending ayah.`;return}}db.sessions.push(obj);save();closeModal();render()}}
function downloadBackup(){const b=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=`quran-class-backup-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function validBackup(x){if(!x||!Array.isArray(x.students)||!Array.isArray(x.sessions)||x.students.length>5000||x.sessions.length>500000)return false;let ids=new Set;for(let s of x.students){if(typeof s.id!=='string'||typeof s.name!=='string'||s.name.length>80||ids.has(s.id))return false;ids.add(s.id)}for(let r of x.sessions){if(typeof r.id!=='string'||!ids.has(r.studentId)||typeof r.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!['memorization','revision','attendance','homework'].includes(r.type))return false;if(r.type!=='attendance'&&(!Number.isInteger(r.surah)||r.surah<0||r.surah>=SURAHS.length||!Number.isInteger(r.from)||!Number.isInteger(r.to)||r.from<1||r.from>r.to||r.to>SURAHS[r.surah][1]))return false;if(r.type==='homework'&&(typeof r.dueDate!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.dueDate)||!['pending','completed'].includes(r.status)))return false}return true}
function openBackup(){modal(`<h2>Data & Backup</h2><p>All student data is stored locally in this browser, not on a server. It will not automatically sync across devices.</p><div class="notice">Export your data regularly, especially before reinstalling the app, switching devices, clearing browser data, or updating your phone. Keep backups private because they contain student information.</div><div class="section actions"><button class="btn" id="exportBtn">⬇ Export JSON Backup</button><button class="btn secondary" id="importBtn">⬆ Restore Backup</button></div><div class="modal-footer"><button class="btn secondary" data-close>Close</button></div>`);$('exportBtn').onclick=downloadBackup;$('importBtn').onclick=()=>$('fileImport').click()}
$('fileImport').onchange=async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>15_000_000){alert('Backup file is too large.');return}try{let x=JSON.parse(await file.text());if(!validBackup(x))throw new Error('Invalid backup format');if(!confirm(`Replace your current ${db.students.length} student records with this backup containing ${x.students.length} students? This replaces all current data.`))return;db={version:1,students:x.students,sessions:x.sessions};save();selected=null;search='';groupFilter='';closeModal();render();alert('Backup restored successfully.')}catch(err){alert('Could not restore: '+err.message)}};$('backupButton').onclick=openBackup;window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
